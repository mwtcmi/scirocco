# Deploys the Cloudflare Workers from this repo. The website itself deploys through Cloudflare Pages.
#   push to main    -> tests, then database migrations + deploy for the live store, Pitwall and the leaderboard
#   push to staging -> tests, then database migrations + deploy for the test store and test Pitwall
# Also rebuilds the store pages from store/catalog.json (for example after a price change saved in Pitwall)
# and commits them if they changed; Cloudflare Pages then publishes that commit.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, on this account).
name: Workers

on:
  push:
    branches: [main, staging]
    paths:
      - 'store/**'
      - 'leaderboard/**'
      - 'pitwall/**'
      - 'scripts/build-store.mjs'
      - 'tests/pitwall.test.mjs'
      - 'tests/store.test.mjs'
      - 'tests/leaderboard.test.mjs'
      - 'tests/helpers/**'
      - '.github/workflows/workers.yml'
  workflow_dispatch:

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 77c67ba91aeec577da4eb27a9aa99a25
  WRANGLER: npx --yes wrangler@4.158.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/store.test.mjs tests/leaderboard.test.mjs tests/pitwall.test.mjs

  pages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Rebuild store pages and sitemap from catalog.json
        run: |
          node scripts/build-store.mjs
          node scripts/wrap-up.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A paddock paddock.html sitemap.xml robots.txt
            git commit -m "Rebuild store pages from catalog.json"
            git push
          fi

  store:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pick live or test store
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then echo "ENV=" >> $GITHUB_ENV; echo "DB=scirocco799-store" >> $GITHUB_ENV
          else echo "ENV=test" >> $GITHUB_ENV; echo "DB=scirocco799-store-test" >> $GITHUB_ENV; fi
      - name: Database migrations
        working-directory: store
        run: $WRANGLER d1 migrations apply "$DB" --remote --env="$ENV"
      - name: Deploy
        working-directory: store
        run: $WRANGLER deploy --env="$ENV"

  leaderboard:
    if: github.ref_name == 'main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Database migrations
        working-directory: leaderboard
        run: $WRANGLER d1 migrations apply scirocco799-leaderboard --remote
      - name: Deploy
        working-directory: leaderboard
        run: $WRANGLER deploy

  pitwall:
    needs: store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy
        working-directory: pitwall
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then $WRANGLER deploy --env=""; else $WRANGLER deploy --env=test; fi
