# Deploys the Cloudflare Workers from this repo. The website itself deploys through Cloudflare Pages.
#   push to main    -> tests, then database migrations + deploy for the live store and the leaderboard
#   push to staging -> tests, then database migrations + deploy for the test store (Stripe test mode)
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, on this account).
name: Workers

on:
  push:
    branches: [main, staging]
    paths:
      - 'store/**'
      - 'leaderboard/**'
      - 'tests/store.test.mjs'
      - 'tests/leaderboard.test.mjs'
      - 'tests/helpers/**'
      - '.github/workflows/workers.yml'
  workflow_dispatch:

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 77c67ba91aeec577da4eb27a9aa99a25
  WRANGLER: npx --yes wrangler@4.158.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/store.test.mjs tests/leaderboard.test.mjs

  store:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pick live or test store
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then echo "ENV=" >> $GITHUB_ENV; echo "DB=scirocco799-store" >> $GITHUB_ENV
          else echo "ENV=test" >> $GITHUB_ENV; echo "DB=scirocco799-store-test" >> $GITHUB_ENV; fi
      - name: Database migrations
        working-directory: store
        run: $WRANGLER d1 migrations apply "$DB" --remote --env="$ENV"
      - name: Deploy
        working-directory: store
        run: $WRANGLER deploy --env="$ENV"

  leaderboard:
    if: github.ref_name == 'main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Database migrations
        working-directory: leaderboard
        run: $WRANGLER d1 migrations apply scirocco799-leaderboard --remote
      - name: Deploy
        working-directory: leaderboard
        run: $WRANGLER deploy
